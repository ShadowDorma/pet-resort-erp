services:
  - type: web
    name: pet-resort
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SCHEMA
        value: pet_resort
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
